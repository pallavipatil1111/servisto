{% extends "base.html" %}

{% block title %}Server Error - Servisto{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center px-4">
    <div class="max-w-md w-full text-center">
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <!-- Error Icon -->
            <div class="w-24 h-24 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fas fa-server text-red-500 text-3xl"></i>
            </div>
            
            <!-- Error Message -->
            <h1 class="text-4xl font-bold text-gray-900 mb-4">500</h1>
            <h2 class="text-2xl font-semibold text-gray-800 mb-4">Server Error</h2>
            <p class="text-gray-600 mb-8">
                Something went wrong on our end. Please try again later.
            </p>
            
            <!-- Action Buttons -->
            <div class="space-y-4">
                <a href="{{ url_for('index') }}" 
                   class="w-full bg-blue-600 text-white py-3 px-6 rounded-lg hover:bg-blue-700 transition duration-200 font-semibold block">
                    Go Home
                </a>
                <button onclick="location.reload()" 
                   class="w-full border border-gray-300 text-gray-700 py-3 px-6 rounded-lg hover:bg-gray-50 transition duration-200 font-medium block">
                    Try Again
                </button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
